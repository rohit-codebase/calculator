<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restro App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0d0d0f;
            min-height: 100vh;
            padding: 50px 20px 80px;
            color: #f0ece0;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(245, 200, 66, 0.07) 0%, transparent 65%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            right: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 78, 78, 0.05) 0%, transparent 65%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: clamp(32px, 6vw, 48px);
            font-weight: 800;
            margin-bottom: 36px;
            background: linear-gradient(135deg, #f5c842 0%, #fff5c0 50%, #e8a800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .form-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: box-shadow 0.3s ease;
        }

        .form-box:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 30px rgba(245, 200, 66, 0.12);
        }

        input {
            flex: 1;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            font-family: 'Outfit', sans-serif;
            color: #f0ece0;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #4a4640;
        }

        input:focus {
            border-color: rgba(245, 200, 66, 0.5);
            background: rgba(245, 200, 66, 0.04);
            box-shadow: 0 0 0 3px rgba(245, 200, 66, 0.08);
        }

        .add-btn {
            background: linear-gradient(135deg, #f5c842 0%, #e8a800 100%);
            color: #1a1200;
            border: none;
            padding: 13px 22px;
            border-radius: 10px;
            flex-shrink: 0;
            min-width: 130px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            white-space: nowrap;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .add-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.4s ease;
        }

        .add-btn:hover::after {
            left: 100%;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(245, 200, 66, 0.35);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        #list {
            list-style: none;
        }

        #list li {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 12px;
            padding: 18px 22px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            display: flex;
            align-items: center;
            justify-content: space-between;

            font-size: 16px;
            font-weight: 500;
            color: #e0dcd0;

            transition: all 0.25s ease;
            animation: slideIn 0.3s ease both;
        }

        #list li:hover {
            border-color: rgba(245, 200, 66, 0.18);
            background: rgba(255, 255, 255, 0.07);
            transform: translateX(4px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delete-btn {
            background: rgba(255, 78, 78, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 78, 78, 0.25);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: rgba(255, 78, 78, 0.25);
            transform: translateY(-1px);
        }

        /* Edit button — auto-styled since it's dynamically added by JS */
        #list li button:not(.delete-btn) {
            background: rgba(167, 139, 250, 0.12);
            color: #b39dfa;
            border: 1px solid rgba(167, 139, 250, 0.25);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            margin-right: 8px;
            transition: all 0.2s ease;
        }

        #list li button:not(.delete-btn):hover {
            background: rgba(167, 139, 250, 0.25);
            transform: translateY(-1px);
        }

        .empty {
            text-align: center;
            color: #4a4640;
            margin-top: 40px;
            font-size: 15px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>🍽️ Restro App</h1>

        <div class="form-box">

            <input type="text" id="name" placeholder="Enter food name">

            <input type="number" id="price" placeholder="Price">

            <button class="add-btn" onclick="addFood()">
                Add Food
            </button>

        </div>

        <ul id="list"></ul>

    </div>

    <script>

        let localData = JSON.parse(localStorage.getItem("food"));
        let food = localData ? localData : [];
        editId = undefined;

        function addFood() {
            const name = document.querySelector("#name").value;
            const price = document.querySelector("#price").value;
            const id = Date.now();
            if (!editId) {
                const collection = { name, price, id };
                food.push(collection);
            }else{
                food.map((item) => {
                    if (item.id == editId) {
                        item.name = name;
                        item.price = price;
                        return item;
                    }
                })
                clearData();
            }

            localStorage.setItem("food", JSON.stringify(food));
            displayFood();
        }

        function displayFood() {
            let list = document.querySelector("#list");
            let collection = "";
            for (const item of food) {
                collection += "<li>" + item.name + "-" + item.price + "<button onclick=editFood(" + item.id + ")>Edit</button>" + "<button onclick=deleteFood(" + item.id + ")>Delete</button></li>"
            }

            list.innerHTML = collection;
        }

        function editFood(id) {
            selectedFood = food.find((item) => item.id == Number(id));

            editId = id;
            document.querySelector('#name').value = selectedFood.name;
            document.querySelector('#price').value = selectedFood.price;
            document.querySelector('.add-btn').innerHTML = "Update Food";
        }

        function deleteFood(id) {
            food = food.filter((item) => item.id !== Number(id));
            localStorage.setItem("food", JSON.stringify(food));
            displayFood();
        }

        function clearData(){
            editId= undefined;
            document.querySelector('#name').value = "";
            document.querySelector('#price').value = "";
            document.querySelector('#btn').innerHTML = "Add Food";
        }

        displayFood();


    </script>
</body>

</html>
