<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Calculator</title>
    <!-- Modern font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --input-bg: rgba(15, 23, 42, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.1);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .heading {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 28px;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .input-group input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            font-size: 18px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .input-group input::placeholder {
            color: rgba(148, 163, 184, 0.4);
        }

        /* Number input spinner hiding */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .operator {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 28px;
            margin-top: 28px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 22px;
            font-weight: 600;
            border-radius: 14px;
            padding: 14px 0;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--accent) 0%, #4f46e5 100%);
            border: none;
            color: white;
        }

        .btn.primary:hover {
            background: linear-gradient(135deg, var(--accent-hover) 0%, #4338ca 100%);
        }

        .btn.danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.2);
            grid-column: span 2;
            font-size: 16px;
        }

        .btn.danger:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #fecaca;
        }

        #result-container {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        #result-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(59, 130, 246, 0.5), transparent);
        }

        #result-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        #result {
            font-size: 40px;
            font-weight: 700;
            word-wrap: break-word;
            min-height: 48px;
            color: #fff;
            line-height: 1.1;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 24px 20px;
                border-radius: 20px;
            }
            .heading {
                font-size: 24px;
                margin-bottom: 24px;
            }
            .operator {
                gap: 10px;
                margin-bottom: 24px;
            }
            .btn {
                padding: 12px 0;
                font-size: 20px;
            }
            .btn.danger {
                font-size: 15px;
            }
            #result {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="heading">Smart Calculator</h1>
        
        <div class="input-group">
            <label for="num1">First Number</label>
            <input type="number" id="num1" name="num1" placeholder="Enter first value">
        </div>

        <div class="input-group">
            <label for="num2">Second Number</label>
            <input type="number" id="num2" name="num2" placeholder="Enter second value">
        </div>

        <div class="operator">
            <button class="btn primary" onclick="sum()" aria-label="Add">+</button>
            <button class="btn primary" onclick="sub()" aria-label="Subtract">-</button>
            <button class="btn primary" onclick="mul()" aria-label="Multiply">×</button>
            <button class="btn primary" onclick="div()" aria-label="Divide">÷</button>
            <button class="btn danger" onclick="clearResult()">Clear Result</button>
            <button class="btn danger" onclick="allClear()">All Clear</button>
        </div>

        <div id="result-container">
            <div id="result-label">Result</div>
            <div id="result">--</div>
        </div>
    </div>

    <script>
        function sum() {
            let a = Number(document.getElementById('num1').value);
            let b = Number(document.getElementById('num2').value);
            document.getElementById('result').innerHTML = a + b;
        }

        function sub() {
            let a = Number(document.getElementById('num1').value);
            let b = Number(document.getElementById('num2').value);
            document.getElementById('result').innerHTML = a - b;
        }

        function mul() {
            let a = Number(document.getElementById('num1').value);
            let b = Number(document.getElementById('num2').value);
            document.getElementById('result').innerHTML = a * b;
        }

        function div() {
            let a = Number(document.getElementById('num1').value);
            let b = Number(document.getElementById('num2').value);
            
            // Check for division by zero visually
            if (b === 0) {
                document.getElementById('result').innerHTML = "Error";
                return;
            }
            
            // Format to avoid extremely long decimals
            let res = a / b;
            document.getElementById('result').innerHTML = Number.isInteger(res) ? res : res.toFixed(4).replace(/\.?0+$/, '');
        }

        function clearResult() {
            document.getElementById('result').innerHTML = "--";
        }

        function allClear() {
            document.getElementById('result').innerHTML = "--";
            document.getElementById('num1').value = "";
            document.getElementById('num2').value = "";
        }
    </script>
</body>
</html>
